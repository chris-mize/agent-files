[project]
name = "agent-files"
version = "0.1.0"
description = "Canonical AGENTS.md, Agent Skills, colocated evals, and a local Cursor/Codex eval host."
readme = "README.md"
authors = [
    { name = "Christopher Mize", email = "95101960+chris-mize@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
agent-files = "agent_files.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "mdformat>=0.7",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [".venv"]
reportUnusedCallResult = false
